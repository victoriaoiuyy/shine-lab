<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Бутик Shine</title>
    
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/lab4.css">
</head>
<body>
    
    <div class="container mt-5 d-flex flex-column">
        <h2 class="page-title">Асортимент та Акції</h2>

        <div class="row row-custom row-1-style order-1 justify-content-center">
            <div class="col-12">
                <h3 class="section-title">Категорії ароматів</h3>
            </div>
            
            <div class="col-12 col-md-5">
                <div class="shine-card">Жіноча парфумерія</div>
            </div>
            <div class="col-12 col-md-5">
                <div class="shine-card">Чоловіча парфумерія</div>
            </div>
        </div>

        <div class="row row-custom row-2-style order-4 order-sm-2">
            <div class="col-12">
                <h3 class="section-title">Спеціальні пропозиції</h3>
            </div>

            <div class="col-12 col-md-8">
                <div class="shine-card">Ексклюзив: Baccarat Rouge 540 (Хіт продажу)</div>
            </div>
            <div class="col-6 col-md-2">
                <div class="shine-card">Знижка -10%</div>
            </div>
            <div class="col-6 col-md-2 d-none d-md-block">
                <div class="shine-card">Подарунок</div>
            </div>
        </div>

        <div class="row row-custom row-3-style order-3">
            <div class="col-12">
                <h3 class="section-title">Думка покупців</h3>
            </div>

            <div class="col-12">
                <div class="shine-card">Відгуки наших улюблених клієнтів</div>
            </div>
        </div>

        <div class="row row-custom row-4-style order-2 order-sm-4">
            <div class="col-12">
                <h3 class="section-title">Контактна інформація</h3>
            </div>

            <div class="col-12">
                <div class="shine-card">Зв'язатися з консультантом бутику</div>
            </div>
        </div>

    </div>

    <script src="js/bootstrap.min.js"></script>
</body>
</html>
